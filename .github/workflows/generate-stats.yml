name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout profile repo
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install dependencies
          run: pip install requests

        - name: Generate Stats SVGs
          run: |
            mkdir -p generated
            
            # Download Overview Stats, Languages, Streak, and Activity Graph directly via cURL
            curl -s "https://github-readme-stats.vercel.app/api?username=IcoNique-01&show_icons=true&theme=github_dark&hide_border=true&count_private=true" -o generated/overview.svg
            curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=IcoNique-01&layout=compact&theme=github_dark&hide_border=true&langs_count=6" -o generated/languages.svg
            curl -s "https://github-readme-streak-stats.herokuapp.com/?user=IcoNique-01&theme=github-dark-blue&hide_border=true&background=0D1117&ring=2F81F7&fire=2F81F7&currStreakLabel=2F81F7" -o generated/streak.svg
            curl -s "https://github-readme-activity-graph.vercel.app/graph?username=IcoNique-01&bg_color=0D1117&color=2F81F7&line=2F81F7&point=FFFFFF&area=true&area_color=1F6FEB&hide_border=true&custom_title=GitHub%20Activity" -o generated/activity.svg

        - name: Commit generated SVGs
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add generated/
            git commit -m "chore: update GitHub stats SVGs" || exit 0
            git push
